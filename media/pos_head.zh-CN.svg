ize="11.5" fill="#6B7180">是名词），中文 79 个词 158 条、英文 47 个词 97 条，标准答案由 Claude Opus 5.5 按 UD 的规则标注。</text><text x="28" y="1077" font-size="11.5" fill="#6B7180">只按词频：这个词在训练数据里最常见的词性。</text><text x="28" y="1094" font-size="11.5" fill="#6B7180">词性头：读翻译模型 5 层隐藏状态的 10 MB 小网络，上文取候选前的 80 个字，不需要第二个模型。GLM-5.3：关闭思考，同样只看前文。</text><text x="28" y="1111" font-size="11.5" fill="#6B7180">GLM-5.3 只比手写对照：UD 有自己的标注约定（如中文“的”标为 SCONJ、“会”和韩文“있다”标为 AUX），词性头和词频在 UD 训练集上学过，</text><text x="28" y="1128" font-size="11.5" fill="#6B7180">GLM 没学过，按 UD 计分它在 UD 兼类词上只有 56.7%，反映不了它的判断。词性头仍会把部分中文动名、形名兼类词判成名词（如“我强烈|建议”）。</text></svg>
