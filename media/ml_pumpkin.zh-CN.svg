41.9 Q745.9,396 745.9,400.0 V406.0 Q745.9,410 741.9,410 H218 Z" fill="#1098AD"><title>日文 + ja.ngram 短：词和词组（选词） · ML-Flash-1103: 90.4</title></path><text x="751.9" y="408" font-size="12" fill="#1F2330">90.4</text><path d="M218,416 H743.5 Q747.5,416 747.5,420.0 V426.0 Q747.5,430 743.5,430 H218 Z" fill="#5F3DC4"><title>日文 + ja.ngram 短：词和词组（选词） · ML-pumpkin-1103: 90.7</title></path><text x="753.5" y="428" font-size="12" fill="#1F2330">90.7</text><path d="M218,436 H580.2 Q584.2,436 584.2,440.0 V446.0 Q584.2,450 580.2,450 H218 Z" fill="#862E1E"><title>日文 + ja.ngram 长：整句 · ML-Flash-1103: 62.7</title></path><text x="590.2" y="448" font-size="12" fill="#1F2330">62.7</text><path d="M218,456 H602.9 Q606.9,456 606.9,460.0 V466.0 Q606.9,470 602.9,470 H218 Z" fill="#B197FC"><title>日文 + ja.ngram 长：整句 · ML-pumpkin-1103: 66.6</title></path><text x="612.9" y="468" font-size="12" fill="#1F2330">66.6</text><text x="208" y="534.0" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">韩文</text><path d="M218,490 H561.5 Q565.5,490 565.5,494.0 V500.0 Q565.5,504 561.5,504 H218 Z" fill="#1098AD"><title>韩文 短：词和词组（选词） · ML-Flash-1103: 59.5</title></path><text x="571.5" y="502" font-size="12" fill="#1F2330">59.5</text><path d="M218,510 H571.4 Q575.4,510 575.4,514.0 V520.0 Q575.4,524 571.4,524 H218 Z" fill="#5F3DC4"><title>韩文 短：词和词组（选词） · ML-pumpkin-1103: 61.2</title></path><text x="581.4" y="522" font-size="12" fill="#1F2330">61.2</text><text x="224" y="542" font-size="11.5" fill="#6B7180">无长句测试</text><text x="208" y="608.0" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">越南文</text><path d="M218,564 H687.6 Q691.6,564 691.6,568.0 V574.0 Q691.6,578 687.6,578 H218 Z" fill="#1098AD"><title>越南文 短：词和词组（选词） · ML-Flash-1103: 81.1</title></path><text x="697.6" y="576" font-size="12" fill="#1F2330">81.1</text><path d="M218,584 H686.7 Q690.7,584 690.7,588.0 V594.0 Q690.7,598 686.7,598 H218 Z" fill="#5F3DC4"><title>越南文 短：词和词组（选词） · ML-pumpkin-1103: 80.9</title></path><text x="696.7" y="596" font-size="12" fill="#1F2330">80.9</text><text x="224" y="616" font-size="11.5" fill="#6B7180">无长句测试</text><line x1="218" y1="130" x2="218" y2="624" stroke="#C9CDD6"/><text x="28" y="652" font-size="11.5" fill="#6B7180">短：候选里第一个就是对的词的比例，同一语言的各种输入方式等权平均。长：整句完全正确的比例。</text><text x="28" y="669" font-size="11.5" fill="#6B7180">简体中文、英文：在知意输入法引擎里端到端（新选词测试集每三条取一条，长 = 长句输入），加 ng1017，组句头的整句也参与排序（同上图）。</text><text x="28" y="686" font-size="11.5" fill="#6B7180">繁体中文（拼音、注音两种、粤拼、仓颉五代/三代、速成五代/三代）、日文（Mozc 转换、预测、整句）、韩文（补全）、越南文（不带声调、</text><text x="28" y="703" font-size="11.5" fill="#6B7180">只打首字母）：int8 模型对其他输入法引擎的候选排序，每个测试文件 3000 条；繁体和日文加 ngram-ml-1024 的 n-gram（偶数行）。</text><text x="28" y="720" font-size="11.5" fill="#6B7180">繁体和日文的长句：组句头直接按所打的拼音 / 注音 / 粤拼 / 假名写出整句（不经候选、不加 n-gram），每种 3000 条。</text></svg>
