3.5 Q267.5,505 267.5,509.0 V514.0 Q267.5,518 263.5,518 H228 Z" fill="#E0611A"><title>Original Laya: 26.3</title></path><text x="273.5" y="516" font-size="12" font-weight="400" fill="#1F2330">26.3</text><text x="220" y="537" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ML-pumpkin-1103</text><path d="M228,526 H341.4 Q345.4,526 345.4,530.0 V535.0 Q345.4,539 341.4,539 H228 Z" fill="#7048E8"><title>ng1017+ML-pumpkin-1103: 78.3</title></path><text x="351.4" y="537" font-size="12" font-weight="400" fill="#1F2330">78.3</text><text x="220" y="558" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ml-flash-next-preview-1114</text><path d="M228,547 H341.9 Q345.9,547 345.9,551.0 V556.0 Q345.9,560 341.9,560 H228 Z" fill="#E64980"><title>ng1017+ml-flash-next-preview-1114: 78.6</title></path><text x="351.9" y="558" font-size="12" font-weight="400" fill="#1F2330">78.6</text><text x="220" y="579" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zh-lite-next-preview-1120</text><path d="M228,568 H339.5 Q343.5,568 343.5,572.0 V577.0 Q343.5,581 339.5,581 H228 Z" fill="#1971C2"><title>ng1017+zh-lite-next-preview-1120: 77.0</title></path><text x="349.5" y="579" font-size="12" font-weight="400" fill="#1F2330">77.0</text><line x1="228" y1="480" x2="228" y2="585" stroke="#C9CDD6"/><text x="458" y="454" font-size="14" font-weight="700" fill="#1F2330">(f) CPU time per page</text><text x="458" y="471" font-size="11.5" fill="#6B7180">ms, median, 4 threads, lower is better</text><text x="650" y="495" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Frequency</text><text x="662" y="495" font-size="11.5" fill="#6B7180">no model</text><text x="650" y="516" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Original Laya</text><path d="M658,505 H804.0 Q808.0,505 808.0,509.0 V514.0 Q808.0,518 804.0,518 H658 Z" fill="#E0611A"><title>Original Laya: 43.3</title></path><text x="814.0" y="516" font-size="12" font-weight="400" fill="#1F2330">43.3</text><text x="650" y="537" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ML-pumpkin-1103</text><path d="M658,526 H665.8 Q669.8,526 669.8,530.0 V535.0 Q669.8,539 665.8,539 H658 Z" fill="#7048E8"><title>ng1017+ML-pumpkin-1103: 3.4</title></path><text x="675.8" y="537" font-size="12" font-weight="400" fill="#1F2330">3.4</text><text x="650" y="558" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ml-flash-next-preview-1114</text><path d="M658,547 H666.5 Q670.5,547 670.5,551.0 V556.0 Q670.5,560 666.5,560 H658 Z" fill="#E64980"><title>ng1017+ml-flash-next-preview-1114: 3.6</title></path><text x="676.5" y="558" font-size="12" font-weight="400" fill="#1F2330">3.6</text><text x="650" y="579" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zh-lite-next-preview-1120</text><path d="M658,568 H660.6 Q663.2,568 663.2,570.6 V578.4 Q663.2,581 660.6,581 H658 Z" fill="#1971C2"><title>ng1017+zh-lite-next-preview-1120: 1.5</title></path><text x="669.2" y="579" font-size="12" font-weight="400" fill="#1F2330">1.5</text><line x1="658" y1="480" x2="658" y2="585" stroke="#C9CDD6"/><text x="28" y="615" font-size="11.5" fill="#6B7180">Test set: text from SkyPile, LCCC, Chinese and English C4, SODA and Tatoeba with its preceding text, typed in full pinyin,</text><text x="28" y="632" font-size="11.5" fill="#6B7180">initials, mixed, or the first letters of a word; the candidates are the IME engine's own. Every third row (4175; scored where</text><text x="28" y="649" font-size="11.5" fill="#6B7180">the right word is among two or more candidates). End to end in the IME engine (after the pause), the model on the graphics card</text><text x="28" y="666" font-size="11.5" fill="#6B7180">(DirectML); in English word mode the typed text stays first, so the first word after it. Original Laya = convaiinnovations/laya</text><text x="28" y="683" font-size="11.5" fill="#6B7180">on Hugging Face (based on mmBERT-base, not fine-tuned by Zhiyi) ranking the candidates the IME's way.</text><text x="28" y="700" font-size="11.5" fill="#6B7180">ng1017 = a word n-gram (Youmo IME's pinyin language model with science text mixed in, pruned to 79 MB); the composition</text><text x="28" y="717" font-size="11.5" fill="#6B7180">head's sentences also go through the word choice. ng1017+ML-pumpkin-1103 = a 12-layer multilingual word-choice and</text><text x="28" y="734" font-size="11.5" fill="#6B7180">composition model (both heads distilled from fine-tuned Qwen3.5-9B teachers, one head for both, a prefix mask: the context's</text><text x="28" y="751" font-size="11.5" fill="#6B7180">keys and values are computed once per context, a key only runs the candidates and the typed units; only Simplified Chinese and</text><text x="28" y="768" font-size="11.5" fill="#6B7180">English here), CPU time that of a key with the context cached; not in the IME yet.</text><text x="28" y="785" font-size="11.5" fill="#6B7180">ng1017+ml-flash-next-preview-1114 = the 8-layer ML-Flash-1103 trained together with a six-language next-word decoder (its</text><text x="28" y="802" font-size="11.5" fill="#6B7180">word-choice whole graph here), the default from 1.7.0; CPU time scaled from ML-Flash-1103's in the same loop (a key, context cached).</text><text x="28" y="819" font-size="11.5" fill="#6B7180">The earlier 1.4V2-Long-L12, ML-pumpkin-1026, ML-Flash-1031 and ML-Flash-1103 are no longer shown: the first three are below</text><text x="28" y="836" font-size="11.5" fill="#6B7180">ML-pumpkin-1103 on every set at the same or a longer time; ml-flash-next-preview-1114 replaced ML-Flash-1103 (within 0.2 on</text><text x="28" y="853" font-size="11.5" fill="#6B7180">every set). Their numbers are in their releases. ng1017+zh-lite-next-preview-1120 = the small 8-layer, width-256 model (about</text><text x="28" y="870" font-size="11.5" fill="#6B7180">a third of Flash's compute, with a next-word decoder; its word-choice whole graph here, in the compact-format engine), no</text><text x="28" y="887" font-size="11.5" fill="#6B7180">composition head (long input = the engine's own sentences); CPU time as zh-lite-next-preview's (same graph shapes); not in the IME.</text><text x="28" y="904" font-size="11.5" fill="#6B7180">Every row with the composition head</text><text x="28" y="921" font-size="11.5" fill="#6B7180">was re-run in the 1.6.0 engine, where the head's own sentences can come first (most of the gain is on long input whose last</text><text x="28" y="938" font-size="11.5" fill="#6B7180">syllable is typed only partly); the numbers in the text are from the engine of each release.</text><text x="28" y="955" font-size="11.5" fill="#6B7180">Speed: ONNX Runtime 1.24.4, int8, the same 274 pages, Ryzen 5 9600X; the new engine's extra composition runs in the</text><text x="28" y="972" font-size="11.5" fill="#6B7180">background and is not in the page time.</text></svg>
