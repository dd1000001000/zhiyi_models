ext><text x="28" y="956" font-size="11" fill="#6B7180">英文三元 n-gram 由英文训练文本统计。</text><text x="28" y="972" font-size="11" fill="#6B7180">补全：ng1017 预测的前 200 个词里，以已打的字开头的词。Qwen3-1.7B-Base 是训练时打软标签的老师（17 亿参数，beam 32），只作参照。</text></svg>