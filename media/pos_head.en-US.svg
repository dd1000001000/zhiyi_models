749.2,980.0 V985.0 Q749.2,988 746.2,988 H238 Z" fill="#D6336C"><title>Hand-written: English (97) Zhiyi v4-1026 POS head: 89.7</title></path><text x="754.2" y="987" font-size="11" font-weight="700" fill="#1F2330">89.7</text><path d="M238,992 H763.9 Q766.9,992 766.9,995.0 V1000.0 Q766.9,1003 763.9,1003 H238 Z" fill="#C2410C"><title>Hand-written: English (97) Zhiyi v4-1113-RL POS head: 92.8</title></path><text x="771.9" y="1002" font-size="11" font-weight="700" fill="#1F2330">92.8</text><path d="M238,1007 H775.6 Q778.6,1007 778.6,1010.0 V1015.0 Q778.6,1018 775.6,1018 H238 Z" fill="#4C6EF5"><title>Hand-written: English (97) GLM-5.3: 94.8</title></path><text x="783.6" y="1017" font-size="11" fill="#1F2330">94.8</text><line x1="238" y1="130" x2="238" y2="1022" stroke="#C9CDD6"/><text x="28" y="1048" font-size="11.5" fill="#6B7180">UD ambiguous words: words of the UD 2.18 test sets (human labels, never trained on) seen 5+ times in UD's train sets with</text><text x="28" y="1065" font-size="11.5" fill="#6B7180">their most frequent tag at most 75% of them, all 2726, scored by UD's tags. Hand-written pairs: the same candidate after</text><text x="28" y="1082" font-size="11.5" fill="#6B7180">different preceding text (light after "Please turn on the" is a noun, after "The bag is very" an adjective), Chinese 79</text><text x="28" y="1099" font-size="11.5" fill="#6B7180">words / 158 items, English 47 / 97, the right answers labelled by Claude Opus 5.5 following UD's rules. Most frequent</text><text x="28" y="1116" font-size="11.5" fill="#6B7180">tag: the word's most frequent tag in the training data.</text><text x="28" y="1133" font-size="11.5" fill="#6B7180">Head: a 10 MB network on five hidden states of the translator, the last 80 characters before the candidate; no second model.</text><text x="28" y="1150" font-size="11.5" fill="#6B7180">GLM-5.3 (thinking off, the same preceding text) only on the hand-written pairs: UD has its own conventions (Chinese 的 SCONJ,</text><text x="28" y="1167" font-size="11.5" fill="#6B7180">会 and Korean 있다 AUX) that the head and the frequency baseline learnt from UD's train sets and GLM never saw; scored by</text><text x="28" y="1184" font-size="11.5" fill="#6B7180">UD's tags it gets 56.7% of the UD part, which says little about its judgement. The head still calls some Chinese verb/noun</text><text x="28" y="1201" font-size="11.5" fill="#6B7180">and adjective/noun words nouns.</text></svg>
