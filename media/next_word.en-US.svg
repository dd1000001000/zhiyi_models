them "among the 5". Many continuations</text><text x="28" y="774" font-size="11" fill="#6B7180">make sense and only the text's counts, so all scores are low. zh-lite-next-preview = the released int8 graphs (weight-only),</text><text x="28" y="790" font-size="11" fill="#6B7180">zhen-mini-next-preview = the released single 4-bit file; beam 8;</text><text x="28" y="806" font-size="11" fill="#6B7180">with the n-gram, the n-gram's 50 words are scored by the model too and the two are weighted (the weight tuned on dev). The English</text><text x="28" y="822" font-size="11" fill="#6B7180">trigram is counted from the English training text. Completion: ng1017's 200 most likely next words that start with the typed</text><text x="28" y="838" font-size="11" fill="#6B7180">characters. Qwen3-1.7B-Base is the teacher whose top words were the soft labels (1.7B parameters, beam 32), for reference.</text></svg>