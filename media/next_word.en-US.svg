he model gives 5 words: the text's word first is "first right", among them "among the 5". Many continuations</text><text x="28" y="924" font-size="11" fill="#6B7180">make sense and only the text's counts, so all scores are low. zh-lite-next-preview = the released int8 graphs (weight-only),</text><text x="28" y="940" font-size="11" fill="#6B7180">zhen-mini-next-preview = the released single 4-bit file, ml-flash-next-preview-1114 = PyTorch fp32</text><text x="28" y="956" font-size="11" fill="#6B7180">(the released single files checked on 300 rows a set); beam 8;</text><text x="28" y="972" font-size="11" fill="#6B7180">with the n-gram, the n-gram's 50 words are scored by the model too and the two are weighted (the weight tuned on dev). The English</text><text x="28" y="988" font-size="11" fill="#6B7180">trigram is counted from the English training text. Completion: ng1017's 200 most likely next words that start with the typed</text><text x="28" y="1004" font-size="11" fill="#6B7180">characters. Qwen3-1.7B-Base is the teacher whose top words were the soft labels (1.7B parameters, beam 32), for reference.</text></svg>