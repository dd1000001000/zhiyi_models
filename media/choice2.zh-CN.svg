pumpkin-1103: 78.3</title></path><text x="351.4" y="537" font-size="12" font-weight="400" fill="#1F2330">78.3</text><text x="220" y="558" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ml-flash-next-preview-1114</text><path d="M228,547 H341.9 Q345.9,547 345.9,551.0 V556.0 Q345.9,560 341.9,560 H228 Z" fill="#E64980"><title>ng1017+ml-flash-next-preview-1114: 78.6</title></path><text x="351.9" y="558" font-size="12" font-weight="400" fill="#1F2330">78.6</text><text x="220" y="579" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zh-lite-next-preview-1120</text><path d="M228,568 H339.5 Q343.5,568 343.5,572.0 V577.0 Q343.5,581 339.5,581 H228 Z" fill="#1971C2"><title>ng1017+zh-lite-next-preview-1120: 77.0</title></path><text x="349.5" y="579" font-size="12" font-weight="400" fill="#1F2330">77.0</text><line x1="228" y1="480" x2="228" y2="585" stroke="#C9CDD6"/><text x="458" y="454" font-size="14" font-weight="700" fill="#1F2330">(f) CPU 每页耗时</text><text x="458" y="471" font-size="11.5" fill="#6B7180">ms，中位数，4 线程，越低越好</text><text x="650" y="495" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">只按词频</text><text x="662" y="495" font-size="11.5" fill="#6B7180">不用模型</text><text x="650" y="516" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">原始 Laya</text><path d="M658,505 H804.0 Q808.0,505 808.0,509.0 V514.0 Q808.0,518 804.0,518 H658 Z" fill="#E0611A"><title>原始 Laya: 43.3</title></path><text x="814.0" y="516" font-size="12" font-weight="400" fill="#1F2330">43.3</text><text x="650" y="537" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ML-pumpkin-1103</text><path d="M658,526 H665.8 Q669.8,526 669.8,530.0 V535.0 Q669.8,539 665.8,539 H658 Z" fill="#7048E8"><title>ng1017+ML-pumpkin-1103: 3.4</title></path><text x="675.8" y="537" font-size="12" font-weight="400" fill="#1F2330">3.4</text><text x="650" y="558" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ml-flash-next-preview-1114</text><path d="M658,547 H666.5 Q670.5,547 670.5,551.0 V556.0 Q670.5,560 666.5,560 H658 Z" fill="#E64980"><title>ng1017+ml-flash-next-preview-1114: 3.6</title></path><text x="676.5" y="558" font-size="12" font-weight="400" fill="#1F2330">3.6</text><text x="650" y="579" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zh-lite-next-preview-1120</text><path d="M658,568 H660.6 Q663.2,568 663.2,570.6 V578.4 Q663.2,581 660.6,581 H658 Z" fill="#1971C2"><title>ng1017+zh-lite-next-preview-1120: 1.5</title></path><text x="669.2" y="579" font-size="12" font-weight="400" fill="#1F2330">1.5</text><line x1="658" y1="480" x2="658" y2="585" stroke="#C9CDD6"/><text x="28" y="615" font-size="11.5" fill="#6B7180">测试集：SkyPile、LCCC、C4 中文与 C4 英文、SODA、Tatoeba 的文本，带光标前的上文，按全拼、简拼、混打、只打前几个字母等方式输入，</text><text x="28" y="632" font-size="11.5" fill="#6B7180">候选为输入法引擎的实际候选；图中为其中每三条取一条（4175 条，计分的是正确词在候选里且候选至少两个的）。</text><text x="28" y="649" font-size="11.5" fill="#6B7180">在输入法引擎里端到端（停顿后），模型在显卡上（DirectML）；英文模式第一个是打的字母本身，这里看它后面的第一个词。</text><text x="28" y="666" font-size="11.5" fill="#6B7180">原始 Laya = Hugging Face 上的 convaiinnovations/laya（基于 mmBERT-base，未经知意微调），按输入法的方式排候选。</text><text x="28" y="683" font-size="11.5" fill="#6B7180">ng1017 = 词语 n-gram（幽默输入法的拼音语言模型混入科研文本，剪枝到 79 MB），组句头的长句也经选词头排序。</text><text x="28" y="700" font-size="11.5" fill="#6B7180">ng1017+ML-pumpkin-1103 = 12 层的多语言选词和组句模型（选词和组句头由微调过的 Qwen3.5-9B 老师蒸馏，两个头合成一个，加前缀遮罩：</text><text x="28" y="717" font-size="11.5" fill="#6B7180">上文的 K/V 每段上文只算一次，每次按键只算候选和拼音；这里只测简体和英文），CPU 耗时是上文缓存后一次按键的时间；未接入输入法。</text><text x="28" y="734" font-size="11.5" fill="#6B7180">ng1017+ml-flash-next-preview-1114 = 8 层的 ML-Flash-1103 加六种语言续写解码器后一起训练的版本（这里测的是它的选词整图），1.7.0 起的默认；</text><text x="28" y="751" font-size="11.5" fill="#6B7180">CPU 耗时按同一循环里与 ML-Flash-1103 的比例折算（上文缓存后一次按键）。</text><text x="28" y="768" font-size="11.5" fill="#6B7180">较早的 1.4V2-Long-L12、ML-pumpkin-1026、ML-Flash-1031、ML-Flash-1103 不再列出：前三个每项都不如 ML-pumpkin-1103，耗时相同或更长；</text><text x="28" y="785" font-size="11.5" fill="#6B7180">ML-Flash-1103 已由 ml-flash-next-preview-1114 接替，各项相差不到 0.2。它们的成绩见各自的 Release。</text><text x="28" y="802" font-size="11.5" fill="#6B7180">ng1017+zh-lite-next-preview-1120 = 8 层、宽 256 的小模型（约为 Flash 计算量的三分之一，带续写解码器；这里测选词整图，紧凑输入格式的引擎），</text><text x="28" y="819" font-size="11.5" fill="#6B7180">没有组句头，长句为引擎自己的整句；CPU 耗时同 zh-lite-next-preview（图的形状相同）；未接入输入法。</text><text x="28" y="836" font-size="11.5" fill="#6B7180">带组句头的各行都用 1.6.0 的引擎重跑：组句头自己组的整句也能排到首位，最后一个音节没打完的长句提高最多；正文里的数字是各版发布时的引擎。</text><text x="28" y="853" font-size="11.5" fill="#6B7180">速度：ONNX Runtime 1.24.4，int8，同样 274 页，Ryzen 5 9600X；新引擎多出的一次组句在后台算，不计入每页耗时。</text></svg>
