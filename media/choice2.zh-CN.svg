h><text x="351.9" y="600" font-size="12" font-weight="400" fill="#1F2330">78.6</text><text x="220" y="621" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zh-lite-next-preview-1120</text><path d="M228,610 H339.5 Q343.5,610 343.5,614.0 V619.0 Q343.5,623 339.5,623 H228 Z" fill="#1971C2"><title>ng1017+zh-lite-next-preview-1120: 77.0</title></path><text x="349.5" y="621" font-size="12" font-weight="400" fill="#1F2330">77.0</text><text x="220" y="642" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zhen-feather-preview-1121</text><path d="M228,631 H337.5 Q341.5,631 341.5,635.0 V640.0 Q341.5,644 337.5,644 H228 Z" fill="#2B8A3E"><title>ng1017+zhen-feather-preview-1121: 75.7</title></path><text x="347.5" y="642" font-size="12" font-weight="400" fill="#1F2330">75.7</text><line x1="228" y1="522" x2="228" y2="648" stroke="#C9CDD6"/><text x="458" y="496" font-size="14" font-weight="700" fill="#1F2330">(f) CPU 每页耗时</text><text x="458" y="513" font-size="11.5" fill="#6B7180">ms，中位数，4 线程，越低越好</text><text x="650" y="537" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">只按词频</text><text x="662" y="537" font-size="11.5" fill="#6B7180">不用模型</text><text x="650" y="558" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">原始 Laya</text><path d="M658,547 H804.0 Q808.0,547 808.0,551.0 V556.0 Q808.0,560 804.0,560 H658 Z" fill="#E0611A"><title>原始 Laya: 43.3</title></path><text x="814.0" y="558" font-size="12" font-weight="400" fill="#1F2330">43.3</text><text x="650" y="579" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ML-pumpkin-1103</text><path d="M658,568 H665.8 Q669.8,568 669.8,572.0 V577.0 Q669.8,581 665.8,581 H658 Z" fill="#7048E8"><title>ng1017+ML-pumpkin-1103: 3.4</title></path><text x="675.8" y="579" font-size="12" font-weight="400" fill="#1F2330">3.4</text><text x="650" y="600" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ml-flash-next-preview-1114</text><path d="M658,589 H666.5 Q670.5,589 670.5,593.0 V598.0 Q670.5,602 666.5,602 H658 Z" fill="#E64980"><title>ng1017+ml-flash-next-preview-1114: 3.6</title></path><text x="676.5" y="600" font-size="12" font-weight="400" fill="#1F2330">3.6</text><text x="650" y="621" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zh-lite-next-preview-1120</text><path d="M658,610 H660.6 Q663.2,610 663.2,612.6 V620.4 Q663.2,623 660.6,623 H658 Z" fill="#1971C2"><title>ng1017+zh-lite-next-preview-1120: 1.5</title></path><text x="669.2" y="621" font-size="12" font-weight="400" fill="#1F2330">1.5</text><text x="650" y="642" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+zhen-feather-preview-1121</text><path d="M658,631 H660.6 Q663.2,631 663.2,633.6 V641.4 Q663.2,644 660.6,644 H658 Z" fill="#2B8A3E"><title>ng1017+zhen-feather-preview-1121: 1.5</title></path><text x="669.2" y="642" font-size="12" font-weight="400" fill="#1F2330">1.5</text><line x1="658" y1="522" x2="658" y2="648" stroke="#C9CDD6"/><text x="28" y="678" font-size="11.5" fill="#6B7180">测试集：SkyPile、LCCC、C4 中文与 C4 英文、SODA、Tatoeba 的文本，带光标前的上文，按全拼、简拼、混打、只打前几个字母等方式输入，</text><text x="28" y="695" font-size="11.5" fill="#6B7180">候选为输入法引擎的实际候选；图中为其中每三条取一条（4175 条，计分的是正确词在候选里且候选至少两个的）。</text><text x="28" y="712" font-size="11.5" fill="#6B7180">在输入法引擎里端到端（停顿后），模型在显卡上（DirectML）；英文模式第一个是打的字母本身，这里看它后面的第一个词。</text><text x="28" y="729" font-size="11.5" fill="#6B7180">原始 Laya = Hugging Face 上的 convaiinnovations/laya（基于 mmBERT-base，未经知意微调），按输入法的方式排候选。</text><text x="28" y="746" font-size="11.5" fill="#6B7180">ng1017 = 词语 n-gram（幽默输入法的拼音语言模型混入科研文本，剪枝到 79 MB），组句头的长句也经选词头排序。</text><text x="28" y="763" font-size="11.5" fill="#6B7180">ng1017+ML-pumpkin-1103 = 12 层的多语言选词和组句模型（选词和组句头由微调过的 Qwen3.5-9B 老师蒸馏，两个头合成一个，加前缀遮罩：</text><text x="28" y="780" font-size="11.5" fill="#6B7180">上文的 K/V 每段上文只算一次，每次按键只算候选和拼音；这里只测简体和英文），CPU 耗时是上文缓存后一次按键的时间；未接入输入法。</text><text x="28" y="797" font-size="11.5" fill="#6B7180">ng1017+ml-flash-next-preview-1114 = 8 层的 ML-Flash-1103 加六种语言续写解码器后一起训练的版本（这里测的是它的选词整图），1.7.0 起的默认；</text><text x="28" y="814" font-size="11.5" fill="#6B7180">CPU 耗时按同一循环里与 ML-Flash-1103 的比例折算（上文缓存后一次按键）。</text><text x="28" y="831" font-size="11.5" fill="#6B7180">较早的 1.4V2-Long-L12、ML-pumpkin-1026、ML-Flash-1031、ML-Flash-1103 不再列出：前三个每项都不如 ML-pumpkin-1103，耗时相同或更长；</text><text x="28" y="848" font-size="11.5" fill="#6B7180">ML-Flash-1103 已由 ml-flash-next-preview-1114 接替，各项相差不到 0.2。它们的成绩见各自的 Release。</text><text x="28" y="865" font-size="11.5" fill="#6B7180">ng1017+zh-lite-next-preview-1120 = 8 层、宽 256 的小模型（约为 Flash 计算量的三分之一，带续写解码器；这里测选词整图，紧凑输入格式的引擎），</text><text x="28" y="882" font-size="11.5" fill="#6B7180">没有组句头，长句为引擎自己的整句；CPU 耗时同 zh-lite-next-preview（图的形状相同）；未接入输入法。</text><text x="28" y="899" font-size="11.5" fill="#6B7180">ng1017+zhen-feather-preview-1121 = zh-lite-next-preview-1120 加上整句（组句头），词表只留训练数据用到的行；CPU 耗时按同一循环里</text><text x="28" y="916" font-size="11.5" fill="#6B7180">与 1120 的比例折算；未接入输入法。</text><text x="28" y="933" font-size="11.5" fill="#6B7180">带组句头的各行都用 1.6.0 的引擎重跑：组句头自己组的整句也能排到首位，最后一个音节没打完的长句提高最多；正文里的数字是各版发布时的引擎。</text><text x="28" y="950" font-size="11.5" fill="#6B7180">速度：ONNX Runtime 1.24.4，int8，同样 274 页，Ryzen 5 9600X；新引擎多出的一次组句在后台算，不计入每页耗时。</text></svg>
