p 区间。</text><text x="28" y="585" font-size="11.5" fill="#6B7180">ng1017、幽默、CyIME 为 ln P(候选 | 上文)，三元回退照各自格式；万象按 Rime 组句（词库词频 + octagram 搭配分），只比同一行内的顺序。</text><text x="28" y="602" font-size="11.5" fill="#6B7180">文件大小：发布的文件（幽默为解压后的 lm.arpa 文本；万象为语法文件加默认导入的 7 个词库文本）。条目数：一元 + 二元 + 三元</text><text x="28" y="619" font-size="11.5" fill="#6B7180">（万象为语法条目 + 词库词条）。查询次数：给 v3 一行的整串候选打分时查概率的次数（三元查询含回退；万象为语法查询 + 词频查询）。</text><text x="28" y="636" font-size="11.5" fill="#6B7180">后三项以知意 ng1017 为 1.0，对数刻度。ng1017 由幽默的 lm.arpa 与科学文本、网页混合后剪枝而来。</text></svg>
