5" fill="#6B7180">准确率：每行只在能拼出整串输入的候选里比（各家候选相同），首选与答案相同即为对；只用 n-gram；细线为 95% bootstrap 区间。</text><text x="28" y="907" font-size="11.5" fill="#6B7180">三元 / 二元模型为 ln P(候选 | 上文)，按各自格式回退或插值；万象与 Rime 官方语法按 Rime 组句（词频 + octagram 搭配分），只比同一行内的顺序。</text><text x="28" y="924" font-size="11.5" fill="#6B7180">文件大小：各家发布或安装的文件（幽默、open-gram、libpinyin 为文本，libime 为编好的 sc.lm）。条目数：各阶 n-gram 之和（语法为条目 + 词条）。</text><text x="28" y="941" font-size="11.5" fill="#6B7180">查询次数：给 v3 一行的整串候选打分时查概率的次数。后三项以知意 ng1017 为 1.0，对数刻度。ng1017 由幽默的 lm.arpa 混合剪枝而来。</text></svg>
